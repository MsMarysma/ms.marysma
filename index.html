<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيقاتي الرسمية | Ms.Marysma</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        h1 {
            color: #1a73e8;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
        }
        .links-box {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            padding: 12px 25px;
            background-color: #1a73e8;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #1557b0;
        }
        .btn-secondary {
            background-color: #5f6368;
        }
        .btn-secondary:hover {
            background-color: #484c50;
        }
        footer {
            margin-top: 40px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>مرحباً بكم في صفحة تطبيقاتي</h1>
        <p>أنا المبرمجة <strong>Ms.Marysma</strong>، وهنا تجدون الروابط الرسمية وصفحات الدعم وسياسات الخصوصية الخاصة بتطبيقاتي المنشورة على متجر Google Play.</p>

        <div class="links-box">
            <!-- زر الانتقال لصفحة سياسة الخصوصية -->
            <a href="privacy.html" class="btn">سياسة الخصوصية (Privacy Policy)</a>
            
            <!-- يمكنك إضافة رابط متجر جوجل بلاي الخاص بك هنا مستقبلاً -->
            <!-- <a href="رابط_متجرك_هنا" class="btn btn-secondary" target="_blank">تطبيقاتي على Google Play</a> -->
        </div>

        <footer>
            &copy; 2026 Ms.Marysma. All rights reserved.
        </footer>
    </div>

</body>
</html>
